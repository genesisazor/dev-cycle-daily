  }

  .app {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .header-card {
    background: var(--panel);
    border: 3px solid var(--wood);
    box-shadow: 4px 4px 0 0 var(--wood-mid);
    border-radius: 0;
    padding: 18px 20px;
    margin-bottom: 22px;
  }

  .footer-card {
    background: var(--panel);
    border: 3px solid var(--wood);
    box-shadow: 4px 4px 0 0 var(--wood-mid);
    border-radius: 0;
    padding: 10px 16px;
    margin-top: 22px;
  }

  .kicker {
    font-size: 15px;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: 32px;
    margin: 0 0 10px;
    letter-spacing: 0.5px;
    color: var(--wood);
    text-shadow: 3px 3px 0 var(--sun);
  }

  .sub {
    font-size: 18px;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }

  .jar-wrap {
    display: flex;
    justify-content: center;
  }

  .jar-img { width: 190px; height: auto; }

  .shred {
    position: relative;
    background: var(--panel);
    padding: 22px 22px 20px;
    margin: 8px auto 0;
    max-width: 320px;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 3px 5px 0 rgba(92,58,33,0.25);
    clip-path: polygon(
      2% 10%, 12% 2%, 24% 7%, 37% 1%, 50% 6%, 64% 0%, 78% 5%, 90% 1%, 98% 9%,
      97% 55%, 99% 90%, 88% 98%, 74% 93%, 60% 99%, 46% 94%, 32% 100%, 19% 95%, 7% 99%, 1% 90%, 3% 50%
    );
    transform: rotate(-2deg);
  }

  @keyframes dropIn {
    0%   { transform: translateY(-36px) rotate(-9deg) scale(0.85); opacity: 0; }
    60%  { transform: translateY(4px) rotate(-1deg) scale(1.03); opacity: 1; }
    100% { transform: translateY(0) rotate(-2deg) scale(1); opacity: 1; }
  }
  .shred.dropping {
    animation: dropIn 0.5s ease-out;
    animation-fill-mode: forwards;
  }

  .quote-text {
    font-size: 20px;
    line-height: 1.4;
    color: var(--wood);
    font-weight: 700;
    margin-bottom: 12px;
  }
  .quote-text::before { content: "\201C"; }
  .quote-text::after { content: "\201D"; }

  .quote-author {
    font-size: 16px;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .quote-author::before { content: "\2014 "; }

  .btn-primary {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 0.2px;
    background: var(--leaf-dark);
    color: #fff;
    border: 3px solid var(--wood);
    box-shadow: 4px 4px 0 0 var(--wood);
    padding: 12px 20px;
    width: 100%;
    max-width: 320px;
    margin-top: 22px;
    cursor: pointer;
    transition: transform 0.05s, box-shadow 0.05s;
  }
  .btn-primary:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 0 var(--wood);
  }

  .source-note {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 16px;
  }
</style>
</head>

  <div class="shred" id="shred">
    <div class="quote-text" id="quoteText">Loading&hellip;</div>
    <div class="quote-author" id="quoteAuthor"></div>
  </div>

  <button class="btn-primary" id="drawBtn">Draw another</button>
  <div class="footer-card">
    <div class="source-note">A jar of quotes from artists, curated and verified</div>
  </div>
</div>

<script>
  const QUOTES = [
    { quote: "Every child is an artist. The problem is how to remain an artist once we grow up.", author: "Pablo Picasso" },
    { quote: "The chief enemy of creativity is good sense.", author: "Pablo Picasso" },
    { quote: "I am my own muse. I am the subject I know best.", author: "Frida Kahlo" },
    { quote: "I found I could say things with color and shapes that I couldn't say any other way — things I had no words for.", author: "Georgia O'Keeffe" },
    { quote: "I dream my painting and then I paint my dream.", author: "Vincent van Gogh" },
    { quote: "Creativity takes courage.", author: "Henri Matisse" },
    { quote: "Have no fear of perfection — you'll never reach it.", author: "Salvador Dal\u00ed" },
    { quote: "Art is for everybody.", author: "Keith Haring" },
    { quote: "Fashion fades, only style remains the same.", author: "Coco Chanel" },
    { quote: "I don't design clothes, I design dreams.", author: "Ralph Lauren" },
    { quote: "I want to empower women. I want people to be afraid of the women I dress.", author: "Alexander McQueen" },
    { quote: "Fashion you can buy, but style you possess.", author: "Iris Apfel" },
    { quote: "Without deviation from the norm, progress is not possible.", author: "Frank Zappa" },
    { quote: "Music is the space between the notes.", author: "Claude Debussy" },
    { quote: "Aging is an extraordinary process whereby you become the person you always should have been.", author: "David Bowie" },
    { quote: "I am not going to be a rockstar. I am going to be a legend.", author: "Lady Gaga" },
    { quote: "The hardest thing is to do something which is close to nothing.", author: "Marina Abramovi\u0107" },
    { quote: "A dream you dream alone is only a dream. A dream you dream together is reality.", author: "Yoko Ono" },
    { quote: "I fight pain and anxiety by continuing to make works of art.", author: "Yayoi Kusama" },
    { quote: "Art is what you can get away with.", author: "Andy Warhol" },
    { quote: "In the future, everyone will be world-famous for 15 minutes.", author: "Andy Warhol" },
    { quote: "One of the things which strongly draws me to generative art is the idea that the thing is so big, in that there are so many variations, that not even the artist can see all the possibilities.", author: "Brian Eno" },
    { quote: "I'm an artist who truly understands technology.", author: "Refik Anadol" },
    { quote: "The cathode ray tube will replace the canvas.", author: "Nam June Paik" },
    { quote: "Photography is truth. Cinema is truth 24 times a second.", author: "Jean-Luc Godard" },
    { quote: "The limitations in your photography are in yourself, for what we see is what we are.", author: "Ernst Haas" },
    { quote: "I don't think about art when I'm working. I try to think about life.", author: "Jean-Michel Basquiat" }
  ];

  const quoteTextEl = document.getElementById('quoteText');
  const quoteAuthorEl = document.getElementById('quoteAuthor');
  const drawBtn = document.getElementById('drawBtn');
  const shredEl = document.getElementById('shred');

  let lastIndex = -1;

  function drawQuote() {
    let idx;
    do {
      idx = Math.floor(Math.random() * QUOTES.length);
    } while (idx === lastIndex && QUOTES.length > 1);
    lastIndex = idx;

    const pick = QUOTES[idx];
    quoteTextEl.textContent = pick.quote;
    quoteAuthorEl.textContent = pick.author;

    shredEl.classList.remove('dropping');
    void shredEl.offsetWidth; // restart animation
    shredEl.classList.add('dropping');
  }

  drawBtn.addEventListener('click', drawQuote);
  drawQuote();
</script>
